[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.3.0"
description = "Repository engineering health and quality intelligence CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pavankumar"}]
keywords = ["developer-tools", "repository", "code-quality", "engineering", "github", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repolens = "repolens:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["repolens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
