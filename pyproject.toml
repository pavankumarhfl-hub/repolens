[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "A lightweight repository engineering-hygiene scanner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pavankumar"}]

[project.scripts]
repolens = "repolens:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
